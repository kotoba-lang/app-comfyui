[project]
name = "comfyui-adapter"
version = "0.2.0"
description = "OpenAI API → ComfyUI adapter (image + video + audio + LLM passthrough). Runs on Vultr L40S per ADR-0050."
requires-python = ">=3.12,<3.13"
dependencies = [
    "starlette>=0.38",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "Pillow>=10",
    "litellm[proxy]>=1.52",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.300",
]

[tool.uv]
package = false
