---
# ComfyUI Pattern 1 — single Vultr L40S 48GB (ADR-0050).
#
# Usage:
#   ansible-playbook site.yml \
#     -e hf_token=$(security find-generic-password -s etzhayyim.hf -a HF_TOKEN -w) \
#     -e cloudflared_tunnel_token=$(security find-generic-password -s etzhayyim.cf -a COMFYUI_TUNNEL_TOKEN -w)
#
# Idempotent — safe to re-run. First run provisions everything (~1-2 h model DL);
# subsequent runs converge only drifted state.

- name: ComfyUI Pattern 1 provision / converge
  hosts: comfyui-l40s
  become: true
  gather_facts: true

  roles:
    - role: common         # base OS, user, ufw, uv, ffmpeg
    - role: nvidia         # NVIDIA driver 545+ + CUDA 12.4 + nvidia-container-toolkit
    - role: comfyui        # ComfyUI git clone + custom nodes + systemd unit
    - role: models         # HF model downloads (~100-150 GiB)
    - role: adapter        # deploy 60-apps/.../adapter/server.py + systemd
    - role: llm-backend    # llama.cpp server + Qwen 2.5 7B Q4 + systemd
    - role: cloudflared    # tunnel connector + systemd

  post_tasks:
    - name: Report service state
      ansible.builtin.shell: |
        systemctl is-active comfyui adapter llm-backend cloudflared || true
      changed_when: false
      register: svc_state
    - name: Show service state
      ansible.builtin.debug:
        var: svc_state.stdout_lines
