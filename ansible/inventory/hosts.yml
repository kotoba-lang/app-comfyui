# ComfyUI Pattern 1 — single Vultr L40S 48GB instance.
# Populate `ansible_host` from Terraform output (`terraform output -raw comfyui_ip`)
# or env `COMFYUI_HOST`. SSH key is the shared etzhayyim operator key.
#
# Destroy-safe design: the comfy user's /opt/comfyui and /data mounts are on
# a persistent Vultr block storage volume (100 GiB). Tearing down the instance
# preserves models + adapter venv + tunnel credentials.

all:
  hosts:
    comfyui-l40s:
      ansible_host: "{{ lookup('env', 'COMFYUI_HOST') | default('127.0.0.1', true) }}"
      ansible_user: "{{ lookup('env', 'COMFYUI_SSH_USER') | default('ubuntu', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'COMFYUI_SSH_KEY') | default('~/.ssh/id_ed25519', true) }}"
      ansible_python_interpreter: /usr/bin/python3
